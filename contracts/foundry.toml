[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc = "0.8.28"

# 0G Galileo runs an EVM that supports Cancun. Matching it here rather than
# letting the default drift, so what is tested is what is deployed.
evm_version = "cancun"

# The relayed entry points take enough parameters to exhaust the stack under the
# legacy pipeline. via-IR is the documented answer, and the optimizer with it
# keeps the deployed bytecode small — gas here is somebody else's money, since
# the relayer pays for every mint and evolve.
via_ir = true
optimizer = true
optimizer_runs = 200

# A warning in a contract that holds ownership of somebody's training history
# is not a style note.
deny = "warnings"

remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/",
]

# Fuzzing and invariant budgets.
#
# The defaults (256 runs, 500-deep invariant sequences) take long enough that
# nobody runs the suite before pushing, and a test suite people skip protects
# nothing. These numbers still explore far more than any hand-written case —
# 96 random inputs per property, and 48 random call sequences 48 deep against
# the invariants — while finishing fast enough to stay in the loop.
[fuzz]
runs = 96

[invariant]
runs = 48
depth = 48
fail_on_revert = false

[rpc_endpoints]
og_testnet = "https://evmrpc-testnet.0g.ai"
